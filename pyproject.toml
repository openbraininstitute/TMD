[build-system]
requires = [
    "setuptools>=45",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "TMD"
description = "A python package for the topological analysis of neurons."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GNU Lesser General Public License v3.0"}
authors = [
    {name = "Blue Brain Project, EPFL"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "h5py>=3.6.0",
    "scipy>=1.8.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.0.2",
    "munkres>=1.0.12",
    "cached-property>=1.5.1",
    "morphio>=3.3.4,<4",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "m2r2",
    "sphinx>=8.2,<10",
    "obi-sphinx-theme>=2.0.0",
    "sphinx-click",
    "docutils<0.21",
]
test = [
    "mock>=3",
    "pytest>=7",
    "pytest-cov>=3",
    "pytest-html>=3.2.0",
]
viewer = [
    "matplotlib>=3.4.0",
]

[project.urls]
Homepage = "https://TMD.readthedocs.io"
Tracker = "https://github.com/BlueBrain/TMD/issues"
Source = "https://github.com/BlueBrain/TMD"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tmd*"]
namespaces = true

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["pyproject.toml", "tmd/**/*.py", "tests/**/*.py", "examples/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "S", # bandit
    "UP", # pyupgrade
]
ignore = [
    "S101", # allow `assert`
    "D107", # missing docstring in __init__
    "D417", # missing argument descriptions in docstrings
    "S110", # try-except-pass
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "A002", # builtin argument shadowing
    "ANN", # Missing type annotation
    "D", # pydocstyle
    "ERA001", # Found commented-out code
    "INP001", # Missing `__init__.py`
    "PLC2701", # Private name import from external module
    "PLR2004", # magic value (constant) used in comparison (i.e. expected == 3)
    "S101", # Use of `assert` detected
    "S106", # Magic value
    "SIM117", # Use a single `with` statement with multiple contexts
    "SLF001", # private member access
]
"examples/**/*.py" = [
    "B006", # mutable argument default
    "B008", # function call in default argument
    "D",
    "INP001",
    "S101",
    "S110", # try-except-pass
]

[tool.ruff.lint.pylint]
# Maximum number of arguments for function / method
max-args = 13
# Maximum number of locals for function / method body
max-locals = 21
# Maximum number of return / yield for function / method body
max-returns = 6
# Maximum number of branch for function / method body
max-branches = 12
# Maximum number of statements in function / method body
max-statements = 50
# Maximum number of public methods for a class (see R0904).
max-public-methods = 60

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = 100
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
