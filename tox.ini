[base]
name = tmd
files = {[base]name} tests docs/source/conf.py tools

[tox]
envlist =
    check-packaging
    lint
    docs
    min_versions
    py{310,311,312,313,314}
    coverage

minversion = 3.18

[testenv]
extras =
    test
    viewer
setenv =
    COVERAGE_FILE = {env:COVERAGE_FILE:.coverage-{envname}}
deps =
    min_versions: packaging
    min_versions: pip
    min_versions: tomli
commands =
    min_versions: python {toxinidir}/tools/generate_min_requirements.py -e test -o {envtmpdir}/requirements_min.txt
    min_versions: python -m pip install -r {envtmpdir}/requirements_min.txt
    min_versions: pip freeze
    pytest \
        --basetemp={envtmpdir} \
        --cov={[base]name} \
        --cov-branch \
        --cov-fail-under=43 \
        --no-cov-on-fail \
        --cov-report term-missing \
        --cov-report html:reports/coverage-{envname} \
        --cov-report xml:reports/coverage-{envname}.xml \
        --html reports/pytest-{envname}.html \
        --junit-xml=reports/pytest-{envname}.xml \
        --self-contained-html \
        {posargs}

[testenv:coverage]
skip_install = true
deps = coverage
allowlist_externals = /bin/bash
commands =
    /bin/bash -c 'coverage combine .coverage-py*'
    coverage xml
    coverage report

[testenv:check-packaging]
skip_install = true
deps =
    build
    twine
commands =
    python -m build -o {envtmpdir}/dist
    twine check {envtmpdir}/dist/*

[testenv:min_versions]
basepython = python3.10

[testenv:lint]
basepython = python3.10
deps =
    ruff
commands =
    python -m ruff format --check
    python -m ruff check

[testenv:format]
basepython = python3.10
skip_install = true
deps =
    codespell
    ruff
commands =
    codespell -i 3 -x .codespellignorelines -w {[base]files} README.md CHANGELOG.md docs/source examples
    python -m ruff format
    python -m ruff check --fix

[testenv:docs]
basepython = python3.12
changedir = docs
extras =
    docs
    viewer
allowlist_externals =
    make
# set warnings as errors using the -W sphinx option
commands =
    make clean
    make html SPHINXOPTS=-W

[gh-actions]
python =
  3.10: py310, lint
  3.11: py311
  3.12: py312, check-packaging
  3.13: py313, docs
  3.14: py314
